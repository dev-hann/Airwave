# Airwave – shared live MP3 stream, queue, and Sonos control
# Image: ghcr.io/dev-hann/airwave (CI builds on every push; :latest moves only on tag pushes)
#
# Run:  docker compose up -d
# UI:   http://localhost:8000
#
# In-app updates (Settings → Update → "Update now") require the watchtower service
# below and a WATCHTOWER_TOKEN entry in your .env file:
#   echo "WATCHTOWER_TOKEN=$(openssl rand -hex 16)" >> .env

services:
  airwave:
    image: ghcr.io/dev-hann/airwave:latest
    container_name: airwave
    restart: unless-stopped
    # Sonos discovery relies on SSDP multicast, which does not reach the default
    # Docker bridge network reliably. Host networking allows SoCo discovery to
    # see speakers on the LAN.
    #
    # This is intended for Linux Docker hosts. With host networking the app is
    # still available on http://localhost:8000 and the `ports` section is not used.
    network_mode: host
    depends_on:
      - watchtower
    environment:
      AIRWAVE_WATCHTOWER_URL: "http://127.0.0.1:8080"
      AIRWAVE_WATCHTOWER_TOKEN: "${WATCHTOWER_TOKEN:-}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./data:/app/data
      # Mount host directories into the container and set paths inside the container.
      #- /mnt/music:/mnt/music
      #- /mnt/videos:/mnt/videos

    # Optional env (uncomment as needed):
    #   AIRWAVE_PUBLIC_BASE_URL: "http://192.168.1.50:8000"
    #   AIRWAVE_LOCAL_MEDIA_ROOTS: "/mnt/music,/mnt/videos"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Manual-trigger updater: no polling schedule. The "Update now" button in the
  # app calls its HTTP API (localhost:8080) to pull :latest and recreate airwave.
  # (maintained fork of containrrr/watchtower — the original cannot talk to Docker 25+)
  # Remove this service on bare-metal deployments.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: airwave-watchtower
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      # Feb 31 does not exist — disables scheduled auto-polling.
      WATCHTOWER_SCHEDULE: "0 0 31 2 *"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN in .env}"
      WATCHTOWER_CLEANUP: "true"
