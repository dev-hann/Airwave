name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
    branches: ["**"]


jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          for pkg in packages/domain packages/usecases packages/db apps/node-server; do
            (cd "$pkg" && pnpm exec tsc --noEmit)
          done

      - name: Run vitest
        run: pnpm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Frontend typecheck (vue-tsc)
        run: pnpm --filter @airwave/web typecheck

      - name: Frontend unit tests (vitest)
        run: pnpm --filter @airwave/web test

      - name: Install Playwright browsers
        run: pnpm --filter @airwave/node-server exec playwright install chromium --with-deps

      - name: Browser E2E (UI shell)
        run: pnpm --filter @airwave/node-server test:e2e

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [node-tests, frontend-build]
    if: github.event_name == 'push' && (github.ref_type == 'branch' || github.ref_type == 'tag')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REF_SLUG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            APP_VERSION="${{ github.ref_name }}"
          else
            APP_VERSION="dev-${SHORT_SHA}"
          fi
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          # :latest moves only on tag pushes — releases are the deploy trigger.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ghcr.io/${REPO_LOWER}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/${REPO_LOWER}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "ghcr.io/${REPO_LOWER}:${REF_SLUG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

    
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          file: ./Dockerfile

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout (with tags, for gh release context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --latest
